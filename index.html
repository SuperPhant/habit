<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f5">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="习惯记录">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>习惯记录已经合并到 LifeBoard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f4f6f5; color: #1f2933; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); }
  .card { width: 100%; max-width: 440px; background: #fff; border-radius: 20px; padding: 32px 24px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 4px 16px rgba(16, 24, 40, 0.06); }
  img { width: 72px; height: 72px; }
  h1 { font-size: 24px; line-height: 1.35; margin: 16px 0 8px; }
  p { font-size: 16px; line-height: 1.6; margin: 0 0 24px; color: #4b5563; }
  a.btn { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #4f46e5; color: #fff; font-size: 18px; font-weight: 700; text-decoration: none; }
  a.btn:active { background: #4338ca; }
</style>
</head>
<body>
<main>
  <div class="card">
    <img src="icons/icon.svg" alt="">
    <h1>习惯记录已经合并到 LifeBoard</h1>
    <p>以前的项目和记录都在 LifeBoard 的「习惯」里，以后请在 LifeBoard 里记录。</p>
    <a class="btn" id="open-lifeboard" href="https://superphant.github.io/lifeboard-web/">打开 LifeBoard</a>
  </div>
</main>
<script>
  // 清理旧 App 留在这台设备上的东西（只清理习惯记录自己的，不碰同一网站上的 LifeBoard）
  (function () {
    var scope = new URL('./', location.href).href;
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (list) {
          list.forEach(function (r) { if (r.scope === scope) r.unregister(); });
        }).catch(function () {});
      }
      if (window.caches) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { if (k.indexOf('habit-app-') === 0 || k.indexOf('habit-launcher-') === 0) caches.delete(k); });
        }).catch(function () {});
      }
      if (window.indexedDB) indexedDB.deleteDatabase('habit-launcher');
    } catch (e) { /* 不支持就算了 */ }
  })();
</script>
</body>
</html>
